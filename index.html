<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 😋🥳🎂</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
  color: white;
}

h1 {
  font-size: 50px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px white; }
  to { text-shadow: 0 0 25px yellow; }
}

.cake {
  font-size: 100px;
  margin: 20px;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: white;
  color: #ff4757;
}

button:hover {
  background: yellow;
}

.message {
  display: none;
  font-size: 24px;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Happy Birthday 🎉</h1>
  <div class="cake">🎂</div>
  <button id="btn">Click here 🎁</button>
  <div class="message" id="msg">
    Happy Birthday to you no body likes you, you look like MONKEY go back to the ZOO 🥳🎉
  </div>
</div>

<script>
const button = document.getElementById("btn");
const message = document.getElementById("msg");

button.addEventListener("click", () => {
  message.style.display = "block";
});
</script>
</body>
</html>
